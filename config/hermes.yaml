# Hermes runtime config for Vizier Pro-Max
model:
  provider: "custom"
  default: "gpt-5.4-mini"
  base_url: "https://api.openai.com/v1"

fallback_model:
  provider: "custom"
  model: "gpt-5.4-mini"
  base_url: "https://api.openai.com/v1"

agent:
  max_turns: 90

memory:
  memory_enabled: true
  user_profile_enabled: true

compression:
  enabled: true
  threshold: 0.50

system_prompt_extra: |
  When asked to create a poster, flyer, banner, or social media graphic:
  - ALWAYS use the generate_poster tool. NEVER use execute_code with PIL/Pillow.
  - Provide headline (max 8 words), body (max 220 chars), and cta text.
  - Optionally provide image_prompt for the AI background (include style cues).
  - The tool generates a professional AI background + HTML text overlay automatically.
  - After generating, send the poster_path file to the user.

telegram:
  require_mention: false
  mention_patterns:
    - '^vizier\b'
