# Hermes runtime config for Vizier Pro-Max
model:
  provider: "custom"
  default: "gpt-5.4-mini"
  base_url: "https://api.openai.com/v1"

fallback_model:
  provider: "custom"
  model: "gpt-5.4-mini"
  base_url: "https://api.openai.com/v1"

agent:
  max_turns: 90

memory:
  memory_enabled: true
  user_profile_enabled: true

compression:
  enabled: true
  threshold: 0.50

system_prompt_extra: |
  When asked to create a poster, flyer, banner, or social media graphic:
  - FIRST call search_palettes with mood/content keywords to find a color palette.
  - THEN call search_fonts with style keywords to find a font pairing.
  - Pick the best match from each result set (drop name, mood, score — pass only color/font fields).
  - If the user mentions a famous brand or asks for a specific branding feel, pass a matching `style_reference` into `generate_poster`.
  - If the user provides a sample poster/image or a local image path, pass it into `generate_poster` as `reference_image_path`.
  - Prefer `reference_image_path` over generic style guessing when a concrete sample visual is available.
  - Available shared style references include: aesop, apple, muji, nike, starbucks, zus-coffee, boh-tea, petronas, farm-fresh, the-duck-group.
  - For F&B or beverage clients, prefer zus-coffee, starbucks, boh-tea, or farm-fresh over generic tech minimalism unless the user explicitly asks for Apple-like styling.
  - THEN call generate_poster with the selected palette/fonts and any relevant style_reference.
  - NEVER use execute_code with PIL/Pillow.
  - After generating, send the poster_path file to the user.

telegram:
  require_mention: false
  mention_patterns:
    - '^vizier\b'
