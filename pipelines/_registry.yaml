# pipelines/_registry.yaml
# Pipeline index — consumed by tools/run_pipeline.py

pipelines:
  - name: content_generate
    description: "Brief -> RAG retrieval -> content generation -> PDF render -> delivery-ready"
    input:
      brief:
        type: string
        required: true
        description: "Content brief describing what to produce"
      client_id:
        type: string
        required: false
        description: "Client ID for brand context"
      output_format:
        type: string
        required: false
        description: "Output format: 'pdf', 'markdown', 'html' (default: markdown)"
    output:
      content:
        type: string
        description: "Generated content"
      pdf_path:
        type: string
        description: "Path to rendered PDF (if output_format=pdf)"

  - name: clone_converge
    description: "Clone visual design into reusable Jinja2 template via convergence loop"
    input:
      target_image_path: { type: string, required: true }
      output_dir: { type: string, required: false }
      max_iterations: { type: integer, required: false }
      threshold: { type: number, required: false }
    output:
      status: { type: string }
      score: { type: number }

  - name: poster_batch
    description: "CSV + template → batch poster production"
    input:
      template_path: { type: string, required: false }
      data_path: { type: string, required: false }
      output_dir: { type: string, required: false }
    output:
      posters: { type: array }

  - name: competitive_analysis
    description: "Market scan → data analysis → charts → report"
    input:
      topic: { type: string, required: true }
      output_dir: { type: string, required: false }
    output:
      status: { type: string }

  - name: poster_generate
    description: "Two-layer poster: AI background (OpenAI/fal.ai) + HTML text overlay via Playwright"
    input:
      headline: { type: string, required: true, description: "Poster headline (max ~8 words)" }
      body: { type: string, required: true, description: "Poster body text (max ~220 chars)" }
      cta: { type: string, required: false, description: "Call-to-action button text" }
      image_prompt: { type: string, required: false, description: "Custom prompt for AI background" }
      style_reference: { type: string, required: false, description: "Shared style preset such as zus-coffee, starbucks, boh-tea, aesop, or nike" }
      reference_image_path: { type: string, required: false, description: "Local path to a sample poster/image used as direct visual reference" }
      template_name: { type: string, required: false, description: "HTML template name (default: social-post)" }
      image_mode: { type: string, required: false, description: "openai or falai (default: openai)" }
      output_path: { type: string, required: false }
    output:
      poster_path: { type: string }
      hero_path: { type: string }
      template_used: { type: string }

  - name: ads_clone
    description: "Fetch and rank ad creatives from Facebook or TikTok ads libraries"
    input:
      platform: { type: string, required: true, description: "facebook or tiktok" }
      query: { type: string, required: true, description: "Ads-library search query" }
      country: { type: string, required: false }
      limit: { type: integer, required: false }
      status: { type: string, required: false }
      client_id: { type: string, required: false }
    output:
      ads: { type: array }
      count: { type: integer }
      status: { type: string }

  - name: tts_generate
    description: "Text → TTS audio via edge-tts + ffmpeg normalization"
    input:
      text: { type: string, required: true }
      output_path: { type: string, required: false }
      voice: { type: string, required: false }
    output:
      output_path: { type: string }

  - name: structured_nonfiction_generate
    description: "Structured nonfiction family for reports, plans, ebooks, and bundled strategy documents"
    input:
      title: { type: string, required: true }
      author: { type: string, required: true }
      sections: { type: array, required: false }
      charts: { type: array, required: false }
      output_dir: { type: string, required: false }
      subtitle: { type: string, required: false }
      date: { type: string, required: false }
      cover_path: { type: string, required: false }
      brand: { type: object, required: false }
      export_pdf: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
      profile: { type: string, required: false }
      package_mode: { type: string, required: false }
      include_toc: { type: boolean, required: false }
      documents: { type: array, required: false }
      strategy: { type: object, required: false, description: "Structured strategy brief for marketing-plan style profiles" }
      campaign_angles: { type: array, required: false, description: "Campaign angles with promise, proof, channels, and optional scores" }
      creative_variants: { type: array, required: false, description: "Creative executions per angle with headlines, copy, CTA, and optional poster assets" }
      content_calendar: { type: array, required: false, description: "Optional marketing calendar rows for strategy docs" }
      generate_posters: { type: boolean, required: false, description: "Generate missing poster assets for creative variants" }
      poster_defaults: { type: object, required: false, description: "Shared poster-generation defaults such as template_name, client_id, or style_reference" }
      export_operational_assets: { type: boolean, required: false, description: "Export per-variant poster folders with copy.json, notes.md, manifest.json, and captions.csv" }
    output:
      status: { type: string }
      profile: { type: string }
      package_mode: { type: string }
      document_count: { type: integer }
      operational_bundle_dir: { type: string }
      client_bundle_dir: { type: string }
      internal_bundle_dir: { type: string }

  - name: nonfiction_ebook_generate
    description: "Compatibility alias for structured_nonfiction_generate with the ebook profile"
    input:
      title: { type: string, required: true }
      author: { type: string, required: true }
      sections: { type: array, required: true }
      charts: { type: array, required: false }
      output_dir: { type: string, required: false }
      subtitle: { type: string, required: false }
      date: { type: string, required: false }
      cover_path: { type: string, required: false }
      brand: { type: object, required: false }
      export_pdf: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
    output:
      status: { type: string }
      html_path: { type: string }
      markdown_path: { type: string }
      pdf_path: { type: string }
      epub_path: { type: string }

  - name: children_book_generate
    description: "Illustrated storybook with spread-based HTML, PDF, and EPUB exports"
    input:
      title: { type: string, required: true }
      author: { type: string, required: true }
      spreads: { type: array, required: true }
      output_dir: { type: string, required: false }
      subtitle: { type: string, required: false }
      date: { type: string, required: false }
      cover_path: { type: string, required: false }
      brand: { type: object, required: false }
      export_pdf: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
    output:
      status: { type: string }
      html_path: { type: string }
      pdf_path: { type: string }
      epub_path: { type: string }

  - name: novel_generate
    description: "Novel manuscript pipeline with chapter packaging for HTML, PDF, and EPUB"
    input:
      title: { type: string, required: true }
      author: { type: string, required: true }
      chapters: { type: array, required: true }
      output_dir: { type: string, required: false }
      subtitle: { type: string, required: false }
      date: { type: string, required: false }
      cover_path: { type: string, required: false }
      brand: { type: object, required: false }
      export_pdf: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
    output:
      status: { type: string }
      html_path: { type: string }
      pdf_path: { type: string }
      epub_path: { type: string }
