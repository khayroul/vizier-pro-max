# pipelines/_registry.yaml
# Pipeline index — consumed by tools/run_pipeline.py

pipelines:
  - name: content_generate
    description: "Brief -> RAG retrieval -> content generation -> PDF render -> delivery-ready"
    input:
      brief:
        type: string
        required: true
        description: "Content brief describing what to produce"
      client_id:
        type: string
        required: false
        description: "Client ID for brand context"
      output_format:
        type: string
        required: false
        description: "Output format: 'pdf', 'markdown', 'html' (default: markdown)"
    output:
      content:
        type: string
        description: "Generated content"
      pdf_path:
        type: string
        description: "Path to rendered PDF (if output_format=pdf)"

  - name: clone_converge
    description: "Clone visual design into reusable Jinja2 template via convergence loop"
    input:
      target_image_path: { type: string, required: true }
      output_dir: { type: string, required: false }
      max_iterations: { type: integer, required: false }
      threshold: { type: number, required: false }
    output:
      status: { type: string }
      score: { type: number }

  - name: poster_batch
    description: "CSV + template → batch poster production"
    input:
      template_path: { type: string, required: false }
      data_path: { type: string, required: false }
      output_dir: { type: string, required: false }
    output:
      posters: { type: array }

  - name: competitive_analysis
    description: "Market scan → data analysis → charts → report"
    input:
      topic: { type: string, required: true }
      output_dir: { type: string, required: false }
    output:
      status: { type: string }

  - name: poster_generate
    description: "Two-layer poster: AI background (OpenAI/fal.ai) + HTML text overlay via Playwright"
    input:
      headline: { type: string, required: true, description: "Poster headline (max ~8 words)" }
      body: { type: string, required: true, description: "Poster body text (max ~220 chars)" }
      cta: { type: string, required: false, description: "Call-to-action button text" }
      image_prompt: { type: string, required: false, description: "Custom prompt for AI background" }
      style_reference: { type: string, required: false, description: "Shared style preset such as zus-coffee, starbucks, boh-tea, aesop, or nike" }
      reference_image_path: { type: string, required: false, description: "Local path to a sample poster/image used as direct visual reference" }
      template_name: { type: string, required: false, description: "HTML template name (default: social-post)" }
      image_mode: { type: string, required: false, description: "openai or falai (default: openai)" }
      output_path: { type: string, required: false }
    output:
      poster_path: { type: string }
      hero_path: { type: string }
      template_used: { type: string }

  - name: ads_clone
    description: "Fetch and rank ad creatives from Facebook or TikTok ads libraries"
    input:
      platform: { type: string, required: true, description: "facebook or tiktok" }
      query: { type: string, required: true, description: "Ads-library search query" }
      country: { type: string, required: false }
      limit: { type: integer, required: false }
      status: { type: string, required: false }
      client_id: { type: string, required: false }
    output:
      ads: { type: array }
      count: { type: integer }
      status: { type: string }

  - name: tts_generate
    description: "Text → TTS audio via edge-tts + ffmpeg normalization"
    input:
      text: { type: string, required: true }
      output_path: { type: string, required: false }
      voice: { type: string, required: false }
    output:
      output_path: { type: string }

  - name: structured_nonfiction_generate
    description: "Structured nonfiction family for reports, plans, ebooks, and bundled strategy documents"
    input:
      title: { type: string, required: true }
      author: { type: string, required: true }
      sections: { type: array, required: false }
      charts: { type: array, required: false }
      output_dir: { type: string, required: false }
      subtitle: { type: string, required: false }
      date: { type: string, required: false }
      cover_path: { type: string, required: false }
      brand: { type: object, required: false }
      export_pdf: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
      profile: { type: string, required: false }
      package_mode: { type: string, required: false }
      include_toc: { type: boolean, required: false }
      documents: { type: array, required: false }
      strategy: { type: object, required: false, description: "Structured strategy brief for marketing-plan style profiles" }
      campaign_angles: { type: array, required: false, description: "Campaign angles with promise, proof, channels, and optional scores" }
      creative_variants: { type: array, required: false, description: "Creative executions per angle with headlines, copy, CTA, and optional poster assets" }
      content_calendar: { type: array, required: false, description: "Optional marketing calendar rows for strategy docs" }
      generate_posters: { type: boolean, required: false, description: "Generate missing poster assets for creative variants" }
      poster_defaults: { type: object, required: false, description: "Shared poster-generation defaults such as template_name, client_id, or style_reference" }
      export_operational_assets: { type: boolean, required: false, description: "Export per-variant poster folders with copy.json, notes.md, manifest.json, and captions.csv" }
      export_gamma: { type: boolean, required: false, description: "Export the rendered package to Gamma as a presentation or document" }
      gamma_format: { type: string, required: false, description: "Gamma output format: presentation, document, webpage, or social" }
      gamma_text_mode: { type: string, required: false, description: "Gamma text mode: generate, condense, or preserve" }
      gamma_export_as: { type: string, required: false, description: "Optional Gamma export format: pdf, pptx, or png" }
      gamma_theme_id: { type: string, required: false, description: "Gamma theme ID to apply to the generated artifact" }
      gamma_folder_ids: { type: array, required: false, description: "Gamma folder IDs for where the generated artifact should be stored" }
      gamma_num_cards: { type: integer, required: false, description: "Requested number of cards/slides for Gamma presentation outputs" }
      gamma_card_split: { type: string, required: false, description: "Gamma card split strategy: auto or inputTextBreaks" }
      gamma_card_dimensions: { type: string, required: false, description: "Gamma card dimensions such as 16x9, 4x3, A4, letter, 1x1, or 9x16" }
      gamma_image_source: { type: string, required: false, description: "Gamma image source: aiGenerated, webFreeToUseCommercially, or noImages" }
      gamma_image_model: { type: string, required: false, description: "Gamma image model when using aiGenerated image source" }
      gamma_image_style: { type: string, required: false, description: "Gamma free-text image style guidance when using aiGenerated images" }
      gamma_image_style_preset: { type: string, required: false, description: "Gamma built-in image style preset such as photorealistic or illustration" }
      gamma_text_amount: { type: string, required: false, description: "Gamma text density: brief, medium, detailed, or extensive" }
      gamma_tone: { type: string, required: false, description: "Tone hint passed to Gamma textOptions" }
      gamma_audience: { type: string, required: false, description: "Audience hint passed to Gamma textOptions" }
      gamma_language: { type: string, required: false, description: "Output language passed to Gamma textOptions" }
      gamma_additional_instructions: { type: string, required: false, description: "Extra instructions appended to Gamma generation guidance" }
      gamma_template_id: { type: string, required: false, description: "Gamma template ID for from-template generation" }
      gamma_template_prompt: { type: string, required: false, description: "Prompt used when remixing a Gamma template" }
      gamma_header_footer: { type: object, required: false, description: "Gamma headerFooter object for per-card branding and labels" }
      gamma_card_options: { type: object, required: false, description: "Additional Gamma cardOptions merged into the request" }
      gamma_sharing_options: { type: object, required: false, description: "Gamma sharingOptions for workspace and external access" }
      gamma_output_path: { type: string, required: false, description: "Local path for the downloaded Gamma export file" }
    output:
      status: { type: string }
      profile: { type: string }
      package_mode: { type: string }
      document_count: { type: integer }
      operational_bundle_dir: { type: string }
      client_bundle_dir: { type: string }
      internal_bundle_dir: { type: string }
      gamma_url: { type: string }
      gamma_file_path: { type: string }

  - name: marketing_plan_generate
    description: "Brief -> marketing strategy -> campaign angles -> creative pack -> client-ready asset bundle"
    input:
      brief: { type: string, required: true }
      title: { type: string, required: false }
      author: { type: string, required: false }
      client_id: { type: string, required: false }
      output_dir: { type: string, required: false }
      package_mode: { type: string, required: false }
      generate_posters: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
      include_toc: { type: boolean, required: false }
      export_gamma: { type: boolean, required: false }
      gamma_format: { type: string, required: false }
      gamma_text_mode: { type: string, required: false }
      gamma_export_as: { type: string, required: false }
      gamma_theme_id: { type: string, required: false }
      gamma_folder_ids: { type: array, required: false }
      gamma_num_cards: { type: integer, required: false }
      gamma_card_split: { type: string, required: false }
      gamma_card_dimensions: { type: string, required: false }
      gamma_image_source: { type: string, required: false }
      gamma_image_model: { type: string, required: false }
      gamma_image_style: { type: string, required: false }
      gamma_image_style_preset: { type: string, required: false }
      gamma_text_amount: { type: string, required: false }
      gamma_tone: { type: string, required: false }
      gamma_audience: { type: string, required: false }
      gamma_language: { type: string, required: false }
      gamma_additional_instructions: { type: string, required: false }
      gamma_template_id: { type: string, required: false }
      gamma_template_prompt: { type: string, required: false }
      gamma_header_footer: { type: object, required: false }
      gamma_card_options: { type: object, required: false }
      gamma_sharing_options: { type: object, required: false }
      gamma_output_path: { type: string, required: false }
    output:
      status: { type: string }
      title: { type: string }
      source: { type: string }
      document_count: { type: integer }
      client_bundle_dir: { type: string }
      gamma_url: { type: string }
      gamma_file_path: { type: string }

  - name: presentation_deck_generate
    description: "Deck-native Gamma pipeline for client presentations from a brief or structured source content"
    input:
      title: { type: string, required: true }
      author: { type: string, required: false }
      brief: { type: string, required: false }
      sections: { type: array, required: false }
      charts: { type: array, required: false }
      documents: { type: array, required: false }
      subtitle: { type: string, required: false }
      output_dir: { type: string, required: false }
      profile: { type: string, required: false }
      package_mode: { type: string, required: false }
      include_toc: { type: boolean, required: false }
      export_source_pdf: { type: boolean, required: false }
      gamma_export_as: { type: string, required: false }
      gamma_text_mode: { type: string, required: false }
      gamma_theme_id: { type: string, required: false }
      gamma_folder_ids: { type: array, required: false }
      gamma_num_cards: { type: integer, required: false }
      gamma_card_split: { type: string, required: false }
      gamma_card_dimensions: { type: string, required: false }
      gamma_image_source: { type: string, required: false }
      gamma_image_model: { type: string, required: false }
      gamma_image_style: { type: string, required: false }
      gamma_image_style_preset: { type: string, required: false }
      gamma_text_amount: { type: string, required: false }
      gamma_tone: { type: string, required: false }
      gamma_audience: { type: string, required: false }
      gamma_language: { type: string, required: false }
      gamma_additional_instructions: { type: string, required: false }
      gamma_template_id: { type: string, required: false }
      gamma_template_prompt: { type: string, required: false }
      gamma_header_footer: { type: object, required: false }
      gamma_card_options: { type: object, required: false }
      gamma_sharing_options: { type: object, required: false }
      gamma_output_path: { type: string, required: false }
    output:
      status: { type: string }
      title: { type: string }
      source_mode: { type: string }
      gamma_url: { type: string }
      gamma_file_path: { type: string }

  - name: nonfiction_ebook_generate
    description: "Compatibility alias for structured_nonfiction_generate with the ebook profile"
    input:
      title: { type: string, required: true }
      author: { type: string, required: true }
      sections: { type: array, required: true }
      charts: { type: array, required: false }
      output_dir: { type: string, required: false }
      subtitle: { type: string, required: false }
      date: { type: string, required: false }
      cover_path: { type: string, required: false }
      brand: { type: object, required: false }
      export_pdf: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
    output:
      status: { type: string }
      html_path: { type: string }
      markdown_path: { type: string }
      pdf_path: { type: string }
      epub_path: { type: string }

  - name: children_book_generate
    description: "Illustrated storybook with spread-based HTML, PDF, and EPUB exports"
    input:
      title: { type: string, required: true }
      author: { type: string, required: true }
      spreads: { type: array, required: true }
      output_dir: { type: string, required: false }
      subtitle: { type: string, required: false }
      date: { type: string, required: false }
      cover_path: { type: string, required: false }
      brand: { type: object, required: false }
      export_pdf: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
    output:
      status: { type: string }
      html_path: { type: string }
      pdf_path: { type: string }
      epub_path: { type: string }

  - name: novel_generate
    description: "Novel manuscript pipeline with chapter packaging for HTML, PDF, and EPUB"
    input:
      title: { type: string, required: true }
      author: { type: string, required: true }
      chapters: { type: array, required: true }
      output_dir: { type: string, required: false }
      subtitle: { type: string, required: false }
      date: { type: string, required: false }
      cover_path: { type: string, required: false }
      brand: { type: object, required: false }
      export_pdf: { type: boolean, required: false }
      export_epub: { type: boolean, required: false }
    output:
      status: { type: string }
      html_path: { type: string }
      pdf_path: { type: string }
      epub_path: { type: string }
