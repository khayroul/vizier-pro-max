name: pillow_process
description: "Image manipulation — resize, crop, rotate, watermark"
version: "1.0"
toolset: vizier-visual

execution:
  type: python_function
  entrypoint: "scripts.visual.process_image:run"
  timeout: 15

input:
  input_path:
    type: string
    required: true
    description: "Path to input image"
  output_path:
    type: string
    required: true
    description: "Path for output image"
  operation:
    type: string
    required: true
    description: "Operation: resize, crop, rotate, watermark, composite, adjust_color"
  width:
    type: integer
    required: false
  height:
    type: integer
    required: false
  angle:
    type: integer
    required: false
  left:
    type: integer
    required: false
  top:
    type: integer
    required: false
  right:
    type: integer
    required: false
  bottom:
    type: integer
    required: false
  watermark_text:
    type: string
    required: false
  overlay_path:
    type: string
    required: false

output:
  file_path:
    type: string
    description: "Path to processed image"
