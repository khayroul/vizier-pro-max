name: matplotlib_chart
description: "Generate charts — bar, line, pie, scatter"
version: "1.0"
toolset: vizier-research

execution:
  type: python_function
  entrypoint: "scripts.research.render_chart:run"
  timeout: 15

input:
  chart_type:
    type: string
    required: true
    description: "Chart type: bar, line, pie, scatter"
  data:
    type: object
    required: true
    description: "Chart data dict (labels, values, x, y depending on chart type)"
  output_path:
    type: string
    required: true
    description: "Path for output PNG"
  title:
    type: string
    required: false
  xlabel:
    type: string
    required: false
  ylabel:
    type: string
    required: false

output:
  file_path:
    type: string
    description: "Path to generated chart PNG"
