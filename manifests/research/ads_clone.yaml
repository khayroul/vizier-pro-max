name: ads_clone
description: "Fetch and rank ad creatives from Facebook or TikTok ads libraries"
version: "1.0"
toolset: vizier-research

execution:
  type: python_function
  entrypoint: "pipelines.ads_clone:run"
  timeout: 30

input:
  platform:
    type: string
    required: true
    description: "facebook or tiktok"
  query:
    type: string
    required: true
    description: "Ad-library search query"
  country:
    type: string
    required: false
  limit:
    type: integer
    required: false
  status:
    type: string
    required: false
  client_id:
    type: string
    required: false

output:
  ads:
    type: array
  count:
    type: integer
  status:
    type: string
  deliverable_id:
    type: string
