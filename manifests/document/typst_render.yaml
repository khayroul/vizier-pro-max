name: typst_render
description: "Compile Typst markup into PDF"
version: "1.0"
toolset: vizier-document

execution:
  type: python_function
  path: "scripts/document/render_typst.py"
  entrypoint: "render_to_pdf"
  timeout: 30

input:
  content:
    type: string
    required: true
    description: "Text content to render (plain text or Typst markup)"
  output_path:
    type: string
    required: true
    description: "Path for output PDF"
  title:
    type: string
    required: false
    description: "Document title for the header (default: 'Document')"

output:
  pdf_path:
    type: string
    description: "Path to generated PDF"
