[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vizier-pro-max"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "pillow>=10.0",
    "weasyprint>=60",
    "ebooklib>=0.18",
    "python-pptx>=0.6",
    "yt-dlp>=2024.1",
    "youtube-transcript-api>=0.6",
    "pytrends>=4.9.0",
    "croniter>=2.0.0",
    "python-telegram-bot>=22.0",
    "playwright>=1.40,<2",
    "pandas>=2.0,<3",
    "matplotlib>=3.8,<4",
    "edge-tts>=7.2.7,<8",
    "scikit-image>=0.22,<1",
    "pixelmatch>=0.3,<1",
    "opencv-python-headless>=4.9,<5",
    "pytesseract>=0.3,<1",
    # lingua-py excluded: no Python 3.14 wheel. L4 language detection degrades gracefully.
    # "lingua-py>=2.0,<3",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.setuptools.packages.find]
include = ["adapter*", "tools*", "plugins*", "pipelines*", "middleware*", "bridge*", "augments*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
